<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SaleSmartly 监听器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 460px; max-height: 620px; font-family: -apple-system, "Microsoft YaHei", sans-serif; font-size: 13px; background: #f5f5f5; }

    .header { background: #1a73e8; color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.active { background: #4caf50; animation: pulse 1.5s infinite; }
    .status-dot.inactive { background: #999; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .tab-bar { display: flex; background: white; border-bottom: 1px solid #e0e0e0; }
    .tab { flex: 1; padding: 6px; text-align: center; cursor: pointer; font-size: 11px; border-bottom: 2px solid transparent; color: #666; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
    .tab:hover { background: #f8f8f8; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 消息面板 */
    .controls { display: flex; gap: 5px; padding: 6px 10px; background: white; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
    .btn { padding: 3px 8px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 11px; background: white; }
    .btn:hover { background: #f0f0f0; }
    .btn.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    .btn.primary:hover { background: #1557b0; }
    .btn.danger { color: #d32f2f; border-color: #d32f2f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stats { padding: 5px 10px; background: white; border-bottom: 1px solid #e0e0e0; display: flex; gap: 14px; font-size: 10px; color: #666; }
    .stats span { color: #1a73e8; font-weight: 600; }

    .msg-tab-bar { display: flex; background: white; border-bottom: 1px solid #e0e0e0; }
    .msg-tab { flex: 1; padding: 4px; text-align: center; cursor: pointer; font-size: 10px; border-bottom: 2px solid transparent; color: #666; }
    .msg-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

    .message-list { padding: 6px; overflow-y: auto; max-height: 380px; }
    .message-item { background: white; border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; border-left: 3px solid #1a73e8; }
    .message-item.agent-msg { border-left-color: #4caf50; }
    .message-item .meta { display: flex; justify-content: space-between; font-size: 10px; color: #999; margin-bottom: 2px; }
    .message-item .tag { padding: 1px 4px; border-radius: 3px; font-size: 9px; }
    .message-item .tag-channel { background: #e8f0fe; color: #1a73e8; }
    .message-item .tag-snippet { background: #fff3e0; color: #e65100; }
    .message-item .tag-full { background: #e8f5e9; color: #2e7d32; }
    .message-item .tag-customer { color: #1a73e8; font-weight: 500; font-size: 11px; }
    .message-item .tag-agent { color: #4caf50; font-weight: 500; font-size: 11px; }
    .message-item .text { color: #333; line-height: 1.3; word-break: break-all; font-size: 11px; }
    .message-item .phone { font-size: 9px; color: #888; margin-top: 1px; }
    .message-item .raw-toggle { color: #1a73e8; cursor: pointer; font-size: 9px; margin-top: 2px; }
    .message-item .raw-data { font-size: 9px; color: #666; background: #f8f8f8; padding: 4px; border-radius: 4px; margin-top: 2px; max-height: 120px; overflow-y: auto; word-break: break-all; display: none; white-space: pre-wrap; }

    .empty { text-align: center; padding: 20px 16px; color: #999; font-size: 12px; }

    /* AI 建议面板 */
    .ai-panel { padding: 10px; }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ai-header .title { font-size: 12px; color: #333; font-weight: 500; }
    .ai-context { background: white; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 10px; color: #666; max-height: 100px; overflow-y: auto; white-space: pre-wrap; line-height: 1.4; }
    .suggestion { background: white; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; border-left: 3px solid #ff9800; }
    .suggestion .s-label { font-size: 10px; color: #ff9800; font-weight: 500; margin-bottom: 3px; }
    .suggestion .s-text { font-size: 11px; color: #333; line-height: 1.4; white-space: pre-wrap; }
    .suggestion .s-actions { margin-top: 4px; display: flex; gap: 6px; }
    .suggestion .s-copy { font-size: 10px; color: #1a73e8; cursor: pointer; padding: 2px 6px; border: 1px solid #1a73e8; border-radius: 3px; background: white; }
    .suggestion .s-copy:hover { background: #e8f0fe; }
    .suggestion .s-copy.copied { color: #4caf50; border-color: #4caf50; }
    .ai-loading { text-align: center; padding: 30px; color: #999; }
    .ai-error { background: #fff3e0; border-radius: 6px; padding: 10px; color: #e65100; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SaleSmartly 消息监听器</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">检测中...</span>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" data-tab="messages">消息</div>
    <div class="tab" data-tab="ai">AI 建议</div>
  </div>

  <!-- 消息面板 -->
  <div class="tab-content active" id="panelMessages">
    <div class="controls">
      <button class="btn primary" id="btnStart">开始监听</button>
      <button class="btn" id="btnStop" disabled>暂停</button>
      <button class="btn danger" id="btnClear">清空</button>
      <button class="btn" id="btnExportJSON">JSON</button>
      <button class="btn" id="btnExportCSV">CSV</button>
      <button class="btn" id="btnExportTXT">TXT</button>
    </div>
    <div class="stats">
      <div>消息: <span id="msgCount">0</span></div>
      <div>客户: <span id="customerCount">0</span></div>
      <div>未读: <span id="unreadCount">0</span></div>
    </div>
    <div class="msg-tab-bar">
      <div class="msg-tab active" data-msgtab="customer">客户消息</div>
      <div class="msg-tab" data-msgtab="agent">客服回复</div>
      <div class="msg-tab" data-msgtab="all">全部</div>
    </div>
    <div class="message-list" id="messageList">
      <div class="empty"><div>等待消息...</div></div>
    </div>
  </div>

  <!-- AI 建议面板 -->
  <div class="tab-content" id="panelAI">
    <div class="ai-panel">
      <div class="ai-header">
        <div class="title" id="aiTitle">AI 回复建议</div>
        <button class="btn primary" id="btnGetAI">获取建议</button>
      </div>
      <div id="aiContent">
        <div class="empty"><div>点击"获取建议"为最新客户对话生成回复</div></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
