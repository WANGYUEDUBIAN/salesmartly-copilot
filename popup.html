<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SaleSmartly AI 助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 420px; max-height: 580px; font-family: -apple-system, "Microsoft YaHei", sans-serif; font-size: 13px; background: #f5f5f5; }

    .header { background: #1a73e8; color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.active { background: #4caf50; animation: pulse 1.5s infinite; }
    .status-dot.inactive { background: #999; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .tab-bar { display: flex; background: white; border-bottom: 1px solid #e0e0e0; }
    .tab { flex: 1; padding: 7px; text-align: center; cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent; color: #666; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
    .tab:hover { background: #f8f8f8; }

    .panel { display: none; }
    .panel.active { display: block; }

    .btn { padding: 5px 12px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 11px; background: white; }
    .btn:hover { background: #f0f0f0; }
    .btn.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    .btn.primary:hover { background: #1557b0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 当前对话面板 */
    .ai-panel { padding: 10px; }
    .ai-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ai-info { font-size: 11px; color: #666; }

    .context-box { background: white; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 10px; color: #666; max-height: 90px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; border: 1px solid #e8e8e8; }
    .context-box .ctx-label { color: #999; font-size: 9px; margin-bottom: 4px; }

    .suggestion { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid #ff9800; }
    .suggestion .s-label { font-size: 11px; color: #ff9800; font-weight: 600; margin-bottom: 4px; }
    .suggestion .s-text { font-size: 12px; color: #333; line-height: 1.5; white-space: pre-wrap; }
    .s-copy { display: inline-block; margin-top: 6px; font-size: 10px; color: #1a73e8; cursor: pointer; padding: 2px 8px; border: 1px solid #1a73e8; border-radius: 3px; background: white; }
    .s-copy:hover { background: #e8f0fe; }
    .s-copy.copied { color: #4caf50; border-color: #4caf50; }

    .loading { text-align: center; padding: 30px; color: #999; }
    .error-box { background: #fff3e0; border-radius: 6px; padding: 10px; color: #e65100; font-size: 11px; }
    .empty { text-align: center; padding: 40px 16px; color: #999; }
    .empty .hint { font-size: 11px; color: #aaa; margin-top: 6px; }

    /* 历史记录面板 */
    .history-list { padding: 6px; overflow-y: auto; max-height: 460px; }
    .history-item { background: white; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; transition: background 0.1s; }
    .history-item:hover { background: #fafafa; }
    .history-item.expanded { background: #fafafa; }
    .hi-header { display: flex; justify-content: space-between; align-items: center; }
    .hi-name { font-size: 13px; color: #333; font-weight: 500; }
    .hi-channel { background: #e8f0fe; color: #1a73e8; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
    .hi-time { font-size: 10px; color: #999; margin-top: 3px; }
    .hi-preview { font-size: 10px; color: #888; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 350px; }
    .hi-detail { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
    .history-item.expanded .hi-detail { display: block; }
    .hi-suggestion { background: #f8f9fa; border-radius: 4px; padding: 8px; margin-bottom: 5px; border-left: 3px solid #ff9800; }
    .hi-suggestion .his-label { font-size: 10px; color: #ff9800; font-weight: 500; margin-bottom: 2px; }
    .hi-suggestion .his-text { font-size: 11px; color: #333; line-height: 1.4; white-space: pre-wrap; }
    .hi-suggestion .s-copy { margin-top: 4px; }
    .hi-actions { margin-top: 8px; display: flex; gap: 6px; }

    /* 客户信息卡片 */
    .user-info-card { background: white; border-radius: 6px; padding: 10px 12px; border: 1px solid #e8e8e8; margin-top: 6px; }
    .ui-row { display: flex; align-items: flex-start; padding: 4px 0; border-bottom: 1px solid #f0f0f0; font-size: 11px; }
    .ui-row:last-child { border-bottom: none; }
    .ui-label { color: #999; min-width: 50px; flex-shrink: 0; }
    .ui-value { color: #333; flex: 1; word-break: break-all; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SaleSmartly AI 助手</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">检测中...</span>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" data-tab="current">当前对话</div>
    <div class="tab" data-tab="history">历史记录</div>
  </div>

  <!-- 当前对话 -->
  <div class="panel active" id="panelCurrent">
    <div class="ai-panel">
      <div class="ai-toolbar">
        <div class="ai-info" id="aiInfo">点击"生成建议"开始</div>
        <button class="btn primary" id="btnGetAI">生成建议</button>
      </div>
      <div id="aiContent">
        <div class="empty">
          <div>打开对话后，点击"生成建议"</div>
          <div class="hint">AI 根据对话上下文生成 3 条回复建议</div>
        </div>
      </div>
    </div>

    <!-- 客户信息 -->
    <div style="padding: 0 10px 10px; border-top: 1px solid #e0e0e0; margin-top: 6px; padding-top: 8px;">
      <div class="ai-toolbar">
        <div class="ai-info" id="userInfoLabel">客户信息</div>
        <button class="btn" id="btnGetUser">抓取客户信息</button>
      </div>
      <div id="userInfoContent"></div>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="panel" id="panelHistory">
    <div class="history-list" id="historyList">
      <div class="empty"><div>暂无历史记录</div></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
